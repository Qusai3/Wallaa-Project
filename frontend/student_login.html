<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المرشد الذكي — دخول الطلاب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --blue-900: #061540;
    --blue-800: #0a2166;
    --blue-600: #1565c0;
    --blue-400: #42a5f5;
    --green-900: #0a2e10;
    --green-800: #1b5e20;
    --green-600: #2e7d32;
    --gold:      #ffd54f;
    --gold-deep: #f9a825;
    --white:     #ffffff;
    --glass-border: rgba(255,255,255,0.15);
    --danger:    #ff5252;
    --font: 'Tajawal', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    overflow-x: hidden; position: relative;
    background: var(--blue-900);
    padding: 24px 16px;
  }

  .bg-gradient {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(135deg, var(--blue-900) 0%, var(--blue-800) 25%, #0d3d6e 45%, var(--green-900) 70%, var(--green-800) 100%);
    background-size: 300% 300%;
    animation: gradShift 14s ease infinite;
  }
  @keyframes gradShift {
    0%   { background-position: 0%   50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0%   50%; }
  }
  .mesh { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .mesh-circle { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.18; animation: floatOrb ease-in-out infinite; }
  .mc1 { width:620px;height:620px; background:radial-gradient(circle,#1976d2,transparent); top:-180px;right:-180px; animation-duration:16s; }
  .mc2 { width:480px;height:480px; background:radial-gradient(circle,#2e7d32,transparent); bottom:-140px;left:-140px; animation-duration:20s; animation-delay:-6s; }
  .mc3 { width:260px;height:260px; background:radial-gradient(circle,#ffd54f,transparent); top:42%;left:8%; animation-duration:11s; animation-delay:-3s; opacity:0.10; }
  @keyframes floatOrb { 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-28px) scale(1.06);} }
  .grid-texture {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  /* ===== CARD ===== */
  .login-card {
    position: relative; z-index: 10;
    background: rgba(8,18,48,0.85);
    backdrop-filter: blur(32px);
    border-radius: 28px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 32px 96px rgba(0,0,0,0.55);
    width: 460px; max-width: 100%;
    padding: 52px 48px;
    animation: cardIn 0.9s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(48px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0)    scale(1); }
  }

  /* ===== HEADER ===== */
  .card-header { text-align: center; margin-bottom: 36px; animation: fadeUp 0.6s 0.3s ease both; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

  .card-logo {
    width: 72px; height: 72px; border-radius: 50%;
    background: linear-gradient(135deg, var(--blue-600), var(--green-600));
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; margin: 0 auto 20px;
    box-shadow: 0 0 0 8px rgba(21,101,192,0.15), 0 8px 28px rgba(21,101,192,0.4);
    animation: logoBreath 4s ease-in-out infinite;
  }
  @keyframes logoBreath {
    0%,100% { box-shadow: 0 0 0 8px rgba(21,101,192,0.15), 0 8px 28px rgba(21,101,192,0.4); }
    50%      { box-shadow: 0 0 0 14px rgba(21,101,192,0.08), 0 12px 36px rgba(21,101,192,0.5); }
  }
  .card-header h1 { color: var(--white); font-size: 24px; font-weight: 800; margin-bottom: 6px; }
  .card-header p  { color: rgba(255,255,255,0.45); font-size: 13px; line-height: 1.6; }

  /* ===== FORM ===== */
  .form-group { margin-bottom: 20px; animation: fadeUp 0.5s ease both; }
  .form-label {
    display: block; color: rgba(255,255,255,0.75);
    font-size: 13px; font-weight: 600;
    margin-bottom: 8px; letter-spacing: 0.3px;
  }
  .form-label span { color: var(--gold); }
  .input-wrapper { position: relative; display: flex; align-items: center; }
  .input-icon { position: absolute; right: 14px; font-size: 17px; pointer-events: none; color: rgba(255,255,255,0.35); transition: color 0.2s; }
  .form-input {
    width: 100%; padding: 13px 44px 13px 16px;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    color: var(--white); font-family: var(--font); font-size: 14px;
    transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    outline: none;
  }
  .form-input::placeholder { color: rgba(255,255,255,0.22); }
  .form-input:focus {
    border-color: var(--blue-400);
    background: rgba(255,255,255,0.09);
    box-shadow: 0 0 0 3px rgba(66,165,245,0.15);
  }
  .form-input:focus ~ .input-icon,
  .input-wrapper:focus-within .input-icon { color: var(--blue-400); }
  .form-input.error { border-color: var(--danger); }
  .field-hint { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 5px; padding-right: 4px; }

  /* ===== ALERT ===== */
  .alert {
    border-radius: 12px; padding: 13px 16px;
    font-size: 13px; font-weight: 600; line-height: 1.5;
    margin-bottom: 20px; display: none;
    animation: fadeUp 0.3s ease;
  }
  .alert.show { display: flex; align-items: center; gap: 10px; }
  .alert.error   { background: rgba(255,82,82,0.12); border: 1px solid rgba(255,82,82,0.3); color: #ff8a80; }
  .alert.success { background: rgba(105,240,174,0.1); border: 1px solid rgba(105,240,174,0.25); color: #69f0ae; }

  /* ===== BUTTON ===== */
  .btn-primary {
    width: 100%; padding: 15px 20px; margin-top: 10px;
    background: linear-gradient(135deg, var(--blue-600), var(--green-600));
    border: none; border-radius: 14px;
    font-family: var(--font); font-size: 15px; font-weight: 700;
    color: var(--white); cursor: pointer;
    box-shadow: 0 4px 20px rgba(21,101,192,0.35);
    transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.22s, opacity 0.2s;
    position: relative; overflow: hidden;
  }
  .btn-primary::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0) 100%);
    transform: translateX(-100%); transition: transform 0.5s ease;
  }
  .btn-primary:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 10px 32px rgba(21,101,192,0.45); }
  .btn-primary:hover::after { transform: translateX(100%); }
  .btn-primary:active { transform: translateY(0) scale(0.98); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .back-login { text-align: center; margin-top: 28px; animation: fadeUp 0.6s 0.9s ease both; }
  .back-login a { color: rgba(255,255,255,0.45); font-size: 13px; text-decoration: none; transition: color 0.2s; }
  .back-login a:hover { color: var(--blue-400); }
  .back-login a span { color: var(--blue-400); font-weight: 700; }

  .divider { display:flex;align-items:center;gap:12px;margin:18px 0; }
  .divider::before,.divider::after { content:'';flex:1;height:1px;background:rgba(255,255,255,0.1); }
  .divider span { color:rgba(255,255,255,0.25);font-size:12px; }

  /* ===== LOADING OVERLAY ===== */
  .loading-overlay {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(6,21,64,0.9); backdrop-filter: blur(8px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .loading-overlay.active { opacity: 1; pointer-events: all; }
  .spinner { width: 52px; height: 52px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--gold); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: rgba(255,255,255,0.7); font-size: 15px; font-weight: 500; }
</style>
</head>
<body>

<div class="bg-gradient"></div>
<div class="mesh">
  <div class="mesh-circle mc1"></div>
  <div class="mesh-circle mc2"></div>
  <div class="mesh-circle mc3"></div>
</div>
<div class="grid-texture"></div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p class="loading-text">جارٍ التحقق من بياناتك…</p>
</div>

<div class="login-card">

  <div class="card-header">
    <div class="card-logo">🎓</div>
    <h1>دخول الطلاب</h1>
    <p>أدخل رقمك الجامعي وكلمة السر<br>للوصول إلى حسابك</p>
  </div>

  <!-- ALERT -->
  <div class="alert error" id="alertMsg">
    <span>⚠️</span>
    <span id="alertText"></span>
  </div>

  <!-- FORM -->
  <div class="form-group">
    <label class="form-label" for="studentId">الرقم الجامعي <span>*</span></label>
    <div class="input-wrapper">
      <input class="form-input" id="studentId" type="text" maxlength="7"
             placeholder="7 أرقام" inputmode="numeric" autocomplete="off">
      <span class="input-icon">🪪</span>
    </div>
    <p class="field-hint">الرقم المكوّن من 7 أرقام</p>
  </div>

  <div class="form-group">
    <label class="form-label" for="password">كلمة السر <span>*</span></label>
    <div class="input-wrapper">
      <input class="form-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password">
      <span class="input-icon" id="togglePwdIcon" onclick="togglePwd()" style="cursor:pointer;pointer-events:all;">👁️</span>
    </div>
    <p class="field-hint">كلمة السر التي اخترتها عند التسجيل</p>
  </div>

  <button class="btn-primary" id="loginBtn" onclick="doLogin()">
    🔐 &nbsp; تسجيل الدخول
  </button>

  <div class="divider"><span>أو</span></div>

  <div class="back-login">
    <a href="register.html">ليس لديك حساب؟ <span>أنشئ حساباً جديداً</span></a>
  </div>
  <div class="back-login" style="margin-top:10px;">
    <a href="log_in.html">→ العودة لصفحة تسجيل الدخول الرئيسية</a>
  </div>

</div>

<script>
document.getElementById('studentId').addEventListener('input', function () {
  this.value = this.value.replace(/\D/g, '').slice(0, 7);
});

function togglePwd() {
  const input = document.getElementById('password');
  input.type = input.type === 'password' ? 'text' : 'password';
}

async function doLogin() {
  const btn       = document.getElementById('loginBtn');
  const studentId = document.getElementById('studentId').value.trim();
  const password  = document.getElementById('password').value;

  clearAlert();

  if (!studentId || !/^\d{7}$/.test(studentId)) {
    return showAlert('الرقم الجامعي يجب أن يكون 7 أرقام');
  }
  if (!password || password.length < 6) {
    return showAlert('يرجى إدخال كلمة السر (6 أحرف على الأقل)');
  }

  btn.disabled = true;
  document.getElementById('loadingOverlay').classList.add('active');

  try {
    const res  = await fetch('/api/student/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ student_id: studentId, password: password }),
    });
    const data = await res.json();

    document.getElementById('loadingOverlay').classList.remove('active');

    if (res.ok) {
      // Store student info in sessionStorage for use in chat
      sessionStorage.setItem('student_name',    data.student.name);
      sessionStorage.setItem('student_id',      studentId);
      sessionStorage.setItem('student_email',   data.student.email);
      sessionStorage.setItem('student_phone',   data.student.phone);
      sessionStorage.setItem('student_logged',  'true');
      window.location.href = 'main_page.html';
    } else {
      showAlert(data.error || 'بيانات الدخول غير صحيحة');
      btn.disabled = false;
    }
  } catch (err) {
    document.getElementById('loadingOverlay').classList.remove('active');
    showAlert('تعذّر الاتصال بالخادم. تأكد من تشغيل التطبيق.');
    btn.disabled = false;
  }
}

// Allow enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

function showAlert(msg) {
  const el = document.getElementById('alertMsg');
  document.getElementById('alertText').textContent = msg;
  el.className = 'alert error show';
}
function clearAlert() {
  document.getElementById('alertMsg').classList.remove('show');
}
</script>
</body>
</html>
